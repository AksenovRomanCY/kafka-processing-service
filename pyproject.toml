[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.13"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "app.worker_tasks"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "aiokafka.*",
    "celery.*",
]
ignore_missing_imports = true
