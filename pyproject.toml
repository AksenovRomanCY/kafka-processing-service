[tool.poetry]
name = "kafka-processing-service"
version = "3.0.0"
description = "Kafka message processing service with Celery workers"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
aiokafka = "^0.13.0"
kafka-python = "^2.3.0"
celery = "^5.6.3"
redis = "^7.4.0"
pydantic-settings = "^2.13.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.20.0"
pre-commit = "^4.5.1"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.9"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
markers = ["asyncio: mark async tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.13"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "app.worker_tasks"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "aiokafka.*",
    "celery.*",
]
ignore_missing_imports = true
