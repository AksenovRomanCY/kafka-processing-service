[project]
name = "kafka-processing-service"
version = "3.0.0"
description = "Kafka message processing service with Celery workers"
readme = "README.md"
requires-python = ">=3.14.5,<4.0"
dependencies = [
    "aiokafka>=0.14.0,<0.15.0",
    "kafka-python>=2.3.0,<3.0.0",
    "celery>=5.6.3,<6.0.0",
    "redis>=8.0.0,<9.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "python-json-logger>=4.1.0,<5.0.0",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
mypy = ">=2.1.0,<3.0.0"
pre-commit = ">=4.6.0,<5.0.0"
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
ruff = ">=0.15.15,<0.16.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
markers = ["asyncio: mark async tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.14"

[[tool.mypy.overrides]]
module = "app.worker_tasks"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "aiokafka.*",
    "celery.*",
]
ignore_missing_imports = true
